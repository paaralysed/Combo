<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freezes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #fff0f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .sidebar {
            width: 240px;
            background: #ffe8ec;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
            border-radius: 0 24px 24px 0;
            border: 3px solid #ffd9e0;
            box-shadow: 8px 0 32px rgba(181, 0, 94, 0.15);
        }

        .sidebar-label {
            background: #ffd9e0;
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid #ffcdd8;
            box-shadow: 0 8px 24px rgba(181, 0, 94, 0.2);
        }

        .nav-link {
            color: #5a3f47;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 16px 20px;
            border-radius: 16px;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-link:hover {
            color: #b5005e;
        }

        .nav-link.active {
            color: #b5005e;
        }

        .nav-link.active.powermoves {
            color: #b5005e;
        }

        .nav-link.active.mix {
            color: #b5005e;
        }

        .nav-section-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #380a1a;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        .brand-island {
            position: absolute;
            top: 24px;
            left: 24px;
            background: #ffe8ec;
            border-radius: 16px;
            padding: 16px 24px;
            border: 3px solid #ffd9e0;
            box-shadow: 0 8px 32px rgba(181, 0, 94, 0.2);
        }

        .brand-title {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #380a1a !important;
        }

        .settings-link {
            position: absolute;
            top: 24px;
            right: 24px;
            color: #380a1a;
            text-decoration: none;
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe8ec;
            border-radius: 9999px;
            border: 3px solid #ffcdd8;
            box-shadow: 0 8px 32px rgba(181, 0, 94, 0.2);
            transition: all 0.2s ease;
        }

        .settings-link:hover {
            background: #ffd9e0;
        }

        .machine {
            background: #ffe8ec;
            border-radius: 24px;
            padding: 48px;
            border: 3px solid #ffcdd8;
            box-shadow: 0 12px 40px rgba(181, 0, 94, 0.25);
            max-width: 600px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: #380a1a;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            line-height: 56px;
        }

        .subtitle {
            text-align: center;
            color: #5a3f47;
            font-size: 16px;
            margin-bottom: 48px;
        }

        .slots {
            display: flex;
            gap: 16px;
            margin-bottom: 48px;
            justify-content: center;
        }

        .slot {
            width: 120px;
            height: 140px;
            background: #ffd9e0;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ffcdd8;
            position: relative;
            box-shadow: 0 4px 12px rgba(181, 0, 94, 0.15);
        }

        .slot-inner {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }

        .symbol {
            width: 120px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
            color: #380a1a;
            line-height: 1.3;
        }

        .spin-btn {
            display: block;
            width: 100%;
            padding: 18px 32px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #380a1a;
            background: #ffb1c7;
            border: 3px solid #ff8fa3;
            border-radius: 9999px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(181, 0, 94, 0.25);
        }

        .spin-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 12px rgba(181, 0, 94, 0.2);
            background: #ff8fa3;
        }

        .spin-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 8px rgba(181, 0, 94, 0.15);
        }

        .spin-btn:disabled {
            background: #ffcdd8;
            border-color: #ffb1c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            text-align: center;
            color: #5a3f47;
            font-size: 16px;
            margin-top: 24px;
            min-height: 28px;
        }

        .message.win {
            color: #380a1a;
            font-weight: 600;
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                border-radius: 0 0 24px 24px;
                padding: 12px 16px;
                align-items: center;
                gap: 6px;
                box-shadow: 0 8px 32px rgba(181, 0, 94, 0.15);
            }

            .sidebar-label {
                display: none;
            }

            .nav-link {
                padding: 8px 12px;
                font-size: 11px;
            }

            .main-content {
                padding: 16px;
            }

            .brand-island {
                top: auto;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                padding: 10px 20px;
            }

            .brand-title {
                font-size: 16px;
            }

            .settings-link {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .machine {
                padding: 24px;
            }

            .title {
                font-size: 28px;
                line-height: 32px;
            }

            .subtitle {
                margin-bottom: 24px;
            }

            .slots {
                gap: 8px;
            }

            .slot {
                width: 80px;
                height: 100px;
            }

            .symbol {
                width: 80px;
                height: 100px;
                font-size: 11px;
                padding: 8px;
            }

            .spin-btn {
                padding: 14px 24px;
                font-size: 12px;
            }
        }

</style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-label">
            <span class="nav-section-label">Game Modes</span>
        </div>
        <a href="index.html" class="nav-link powermoves">Powermoves</a>
        <a href="freeze.html" class="nav-link active">Freezes</a>
        <a href="mix.html" class="nav-link mix">Mix</a>
    </aside>
    <main class="main-content">
        <div class="brand-island">
            <span class="brand-title">Combos</span>
        </div>
        <a href="freeze-settings.html" class="settings-link">⚙</a>
        <div class="machine">
            <h1 class="title">Freezes</h1>
            <p class="subtitle">Spin to hold the pose</p>
            <div class="slots">
                <div class="slot"><div class="slot-inner" id="slot1"><div class="symbol">FREEZE</div></div></div>
                <div class="slot"><div class="slot-inner" id="slot2"><div class="symbol">FREEZE</div></div></div>
                <div class="slot"><div class="slot-inner" id="slot3"><div class="symbol">FREEZE</div></div></div>
            </div>
            <button class="spin-btn" id="spinBtn">Spin</button>
            <div class="message" id="message"></div>
        </div>
    </main>

    <script>
        const defaultSymbols = ['Air Baby', 'Air Chair', 'Nike Freeze', 'Baby Freeze', 'Bridge', 'Chair Freeze', 'Elbow Freeze', 'Flag Freeze', 'Headstand', 'Handstand', 'Hollowback', 'Head Hollow', '1-Hand Freeze', 'Pike Freeze', 'Shoulder Freeze', 'Stab', 'Head Elbow'];
        const symbols = JSON.parse(localStorage.getItem('selectedFreezes')) || defaultSymbols;

        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const spinBtn = document.getElementById('spinBtn');
        const message = document.getElementById('message');

        let isSpinning = false;

        function createSymbolList() {
            const list = [];
            for (let i = 0; i < 30; i++) {
                list.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
            return list;
        }

        function getRandomSymbol(exclude) {
            const available = symbols.filter(s => s !== exclude);
            return available[Math.floor(Math.random() * available.length)];
        }

        function spinSlot(slotEl, targetSymbol, delay) {
            return new Promise(resolve => {
                const symbolList = createSymbolList();
                symbolList.push(targetSymbol);
                symbolList.push(targetSymbol);
                symbolList.push(targetSymbol);

                slotEl.innerHTML = symbolList.map(s => `<div class="symbol">${s}</div>`).join('');
                slotEl.style.transform = 'translateY(0)';

                let currentY = 0;
                const symbolHeight = slotEl.querySelector('.symbol').offsetHeight;
                const totalSymbols = symbolList.length;
                const targetY = -(totalSymbols - 3) * symbolHeight;

                let speed = 5;

                const startTime = Date.now() + delay;

                function animate() {
                    if (Date.now() < startTime) {
                        requestAnimationFrame(animate);
                        return;
                    }

                    currentY -= speed;
                    slotEl.style.transform = `translateY(${currentY}px)`;

                    const elapsed = Date.now() - startTime - delay;

                    if (elapsed < 1500) {
                        speed = 25;
                    } else if (elapsed < 2000) {
                        speed = 15;
                    } else if (elapsed < 2500) {
                        speed = 8;
                    } else if (elapsed < 2800) {
                        speed = 3;
                    } else {
                        speed = 1;
                    }

                    if (currentY > targetY && speed > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        slotEl.style.transform = `translateY(${targetY}px)`;
                        resolve(targetSymbol);
                    }
                }

                requestAnimationFrame(animate);
            });
        }

        spinBtn.addEventListener('click', async () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            message.textContent = '';
            message.className = 'message';

            const result1 = symbols[Math.floor(Math.random() * symbols.length)];
            const result2 = getRandomSymbol(result1);
            const result3 = getRandomSymbol(result2);

            const results = await Promise.all([
                spinSlot(slot1, result1, 0),
                spinSlot(slot2, result2, 300),
                spinSlot(slot3, result3, 600)
            ]);

            if (results[0] === results[1] && results[1] === results[2]) {
                message.textContent = 'JACKPOT! You won!';
                message.className = 'message win';
            } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                message.textContent = 'Nice! Two matched!';
                message.className = 'message win';
            }

            isSpinning = false;
            spinBtn.disabled = false;
        });
    </script>
</body>
</html>
