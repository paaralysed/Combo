<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #fff0f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .sidebar {
            width: 240px;
            background: #ffe8ec;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
            border-radius: 0 24px 24px 0;
            border: 3px solid #ffd9e0;
            box-shadow: 8px 0 32px rgba(181, 0, 94, 0.15);
        }

        .sidebar-label {
            background: #ffd9e0;
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid #ffcdd8;
            box-shadow: 0 8px 24px rgba(181, 0, 94, 0.2);
        }

        .nav-link {
            color: #5a3f47;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 16px 20px;
            border-radius: 16px;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-link:hover {
            color: #b5005e;
        }

        .nav-link.active {
            color: #b5005e;
        }

        .nav-section-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #380a1a;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        .brand-island {
            position: absolute;
            top: 24px;
            left: 24px;
            background: #ffe8ec;
            border-radius: 16px;
            padding: 16px 24px;
            border: 3px solid #ffd9e0;
            box-shadow: 0 8px 32px rgba(181, 0, 94, 0.2);
        }

        .brand-title {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #380a1a !important;
        }

        .container {
            background: #ffe8ec;
            border-radius: 24px;
            padding: 48px;
            border: 3px solid #ffcdd8;
            box-shadow: 0 12px 40px rgba(181, 0, 94, 0.25);
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .columns {
            display: flex;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .title {
            text-align: center;
            color: #380a1a;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 40px;
        }

        .subtitle {
            text-align: center;
            color: #5a3f47;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .section-title {
            color: #380a1a;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .select-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-select {
            flex: 1;
            background: #ffd9e0;
            color: #380a1a;
            padding: 12px 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            border: 2px solid #ffcdd8;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .btn-select:hover {
            background: #ffb1c7;
            border-color: #ff8fa3;
            color: #380a1a;
        }

        .moves-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 32px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .move-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: #ffd9e0;
            border-radius: 16px;
            border: 2px solid #ffcdd8;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .move-item:hover {
            background: #ffb1c7;
            border-color: #ff8fa3;
        }

        .move-item.selected {
            border-color: #b5005e;
            background: #ffb1c7;
        }

        .move-item.selected.freeze-item {
            border-color: #b5005e;
            background: #ffb1c7;
        }

        .move-item input {
            display: none;
        }

        .move-name {
            color: #380a1a;
            font-size: 16px;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 18px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #ffb1c7;
            color: #380a1a;
            border: 3px solid #ff8fa3;
            box-shadow: 0 8px 24px rgba(181, 0, 94, 0.25);
        }

        .btn-save:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 12px rgba(181, 0, 94, 0.2);
            background: #ff8fa3;
        }

        .btn-back {
            background: #ffd9e0;
            color: #380a1a;
            border: 3px solid #ffcdd8;
        }

        .btn-back:hover {
            background: #ffb1c7;
            border-color: #ff8fa3;
        }

        .saved-msg {
            text-align: center;
            color: #b5005e;
            font-size: 14px;
            font-weight: 600;
            margin-top: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .saved-msg.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                border-radius: 0 0 24px 24px;
                padding: 12px 16px;
                align-items: center;
                gap: 6px;
                box-shadow: 0 8px 32px rgba(181, 0, 94, 0.15);
            }

            .sidebar-label {
                display: none;
            }

            .nav-link {
                padding: 8px 12px;
                font-size: 11px;
            }

            .main-content {
                padding: 12px;
            }

            .brand-island {
                top: auto;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                padding: 10px 20px;
            }

            .brand-title {
                font-size: 16px;
            }

            .container {
                padding: 20px;
                max-height: 85vh;
                gap: 0;
            }

            .columns {
                flex-direction: column;
                gap: 12px;
            }

            .column {
                gap: 0;
            }

            .title {
                font-size: 22px;
                line-height: 26px;
                margin-bottom: 4px;
            }

            .subtitle {
                margin-bottom: 16px;
                font-size: 13px;
            }

            .section-title {
                margin-bottom: 8px;
                font-size: 11px;
            }

            .select-buttons {
                margin-bottom: 8px;
            }

            .btn-select {
                padding: 8px 12px;
                font-size: 11px;
            }

            .moves-list {
                margin-bottom: 0;
                gap: 4px;
            }

            .move-item {
                padding: 10px 14px;
                gap: 10px;
            }

            .move-name {
                font-size: 14px;
            }

            .buttons {
                margin-top: 8px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 12px;
            }
        }

    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-label">
            <span class="nav-section-label">Game Modes</span>
        </div>
        <a href="index.html" class="nav-link">Powermoves</a>
        <a href="freeze.html" class="nav-link">Freezes</a>
        <a href="mix.html" class="nav-link">Mix</a>
    </aside>
    <main class="main-content">
        <div class="brand-island">
            <span class="brand-title">Combos</span>
        </div>
        <div class="container">
            <h1 class="title">Mix Settings</h1>
            <p class="subtitle">Choose your powermoves and freezes</p>

            <div class="columns">
                <div class="column">
                    <h2 class="section-title">Powermoves</h2>
                    <div class="select-buttons">
                        <button class="btn-select" id="selectAllMoves">Select All</button>
                        <button class="btn-select" id="deselectAllMoves">Deselect All</button>
                    </div>
                    <div class="moves-list" id="movesList"></div>
                </div>

                <div class="column">
                    <h2 class="section-title">Freezes</h2>
                    <div class="select-buttons">
                        <button class="btn-select" id="selectAllFreezes">Select All</button>
                        <button class="btn-select" id="deselectAllFreezes">Deselect All</button>
                    </div>
                    <div class="moves-list" id="freezesList"></div>
                </div>
            </div>

            <div class="buttons">
                <a href="mix.html" class="btn btn-back">Back</a>
                <button class="btn btn-save" id="saveBtn">Save</button>
            </div>

            <div class="saved-msg" id="savedMsg">Settings saved!</div>
        </div>
    </main>

    <script>
        const allPowermoves = [
            '1990', '2000', 'Airflare', 'Backspin', 'Barrel', 'Bellymill',
            'Cricket', 'Drill', 'Elbow Track', 'Flare', 'Halo', 'Headspin',
            'Jackhammer', 'Lotus Windmill', 'Munchmill', 'Swipe', 'Tapmill',
            'Tombstone', 'Turtle', 'UFO', 'Virgin Flare', 'Windmill'
        ];

        const allFreezes = [
            'Air Baby', 'Air Chair', 'Nike Freeze', 'Baby Freeze', 'Bridge',
            'Chair Freeze', 'Elbow Freeze', 'Flag Freeze', 'Headstand', 'Handstand',
            'Hollowback', 'Head Hollow', '1-Hand Freeze', 'Pike Freeze', 'Shoulder Freeze', 'Stab', 'Head Elbow'
        ];

        const movesList = document.getElementById('movesList');
        const freezesList = document.getElementById('freezesList');
        const saveBtn = document.getElementById('saveBtn');
        const savedMsg = document.getElementById('savedMsg');

        let selectedMoves = JSON.parse(localStorage.getItem('selectedMoves')) || [...allPowermoves];
        let selectedFreezes = JSON.parse(localStorage.getItem('selectedFreezes')) || [...allFreezes];

        function renderList(container, items, selected, isFreeze = false) {
            container.innerHTML = items.map(item => `
                <div class="move-item ${selected.includes(item) ? 'selected' : ''} ${isFreeze ? 'freeze-item' : ''}" data-item="${item}">
                    <span class="move-name">${item}</span>
                </div>
            `).join('');

            container.querySelectorAll('.move-item').forEach(el => {
                el.addEventListener('click', () => {
                    const item = el.dataset.item;
                    if (selected.includes(item)) {
                        const idx = selected.indexOf(item);
                        selected.splice(idx, 1);
                        el.classList.remove('selected');
                    } else {
                        selected.push(item);
                        el.classList.add('selected');
                    }
                });
            });
        }

        document.getElementById('selectAllMoves').addEventListener('click', () => {
            selectedMoves = [...allPowermoves];
            renderList(movesList, allPowermoves, selectedMoves);
        });

        document.getElementById('deselectAllMoves').addEventListener('click', () => {
            selectedMoves = [];
            renderList(movesList, allPowermoves, selectedMoves);
        });

        document.getElementById('selectAllFreezes').addEventListener('click', () => {
            selectedFreezes = [...allFreezes];
            renderList(freezesList, allFreezes, selectedFreezes, true);
        });

        document.getElementById('deselectAllFreezes').addEventListener('click', () => {
            selectedFreezes = [];
            renderList(freezesList, allFreezes, selectedFreezes, true);
        });

        saveBtn.addEventListener('click', () => {
            if (selectedMoves.length < 3) {
                alert('Select at least 3 powermoves!');
                return;
            }
            if (selectedFreezes.length < 3) {
                alert('Select at least 3 freezes!');
                return;
            }
            localStorage.setItem('selectedMoves', JSON.stringify(selectedMoves));
            localStorage.setItem('selectedFreezes', JSON.stringify(selectedFreezes));
            savedMsg.classList.add('show');
            setTimeout(() => savedMsg.classList.remove('show'), 2000);
        });

        renderList(movesList, allPowermoves, selectedMoves);
        renderList(freezesList, allFreezes, selectedFreezes, true);
    </script>
</body>
</html>
